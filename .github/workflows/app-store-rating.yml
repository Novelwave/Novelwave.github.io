name: Update the App Store rating

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look up the rating
        run: python3 .github/scripts/update_app_store_rating.py

      - name: Commit and publish a change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "The rating hasn't changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(site): update the app store rating"
          git push
          # Pushes made with this token don't always start a Pages build, so ask for one.
          gh api --method POST "repos/${{ github.repository }}/pages/builds" || true
